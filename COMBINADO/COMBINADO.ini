[Rainmeter]
Update=1000
AccurateText=1

[Background]
meter=string
W=680
H=720
SolidColor=255,255,255,255


; ==========================
; ==========================
; Medidas CPU (Rainmeter API)
; Basado en docs/integracion-rainmeter-webview2.md
; Estas medidas son consumidas por @Resources/web/bundle/cpu.bundle.js
; ==========================

[Variables]
@Include="#@#HWiNfo.inc"

;[ CPU_BASE_FREQUENCY]
; Tipo: Registry → MHz | Naturaleza: estático
; Origen: HKLM\HARDWARE\DESCRIPTION\System\CentralProcessor\0\~MHz
; Valor esperado: frecuencia base nominal del CPU (p.ej. 3600 MHz)
; Uso: enlace para cálculo de reloj dinámico, no se muestra directamente
[CPU_BASE_FREQUENCY]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=~MHz
UpdateDivider=-1

;[ CPU_PERF_PERCENT]
; Tipo: UsageMonitor (PerfMon) → % | Naturaleza: dinámico
; Origen: Processor Information / % Processor Performance / _Total
; Valor esperado: 0–100 (puede superar 100 con boost en algunos sistemas)
; Uso: factor para calcular el reloj nominal efectivo del CPU
[CPU_PERF_PERCENT]
Measure=Plugin
Plugin=UsageMonitor
Category="Processor Information"
Counter="% Processor Performance"
Name="_Total"
UpdateDivider=1


;[ CPU_CLOCK_MHZ]
; Tipo: Calc → MHz | Naturaleza: dinámico
; Fórmula: Round([CPU_BASE_FREQUENCY]*[CPU_PERF_PERCENT]/100)
; Valor esperado: ≈ 800–5000 MHz según carga/turbo
; Uso: consumido por cpu.bundle.js → panel muestra en GHz
[CPU_CLOCK_MHZ]
Measure=Calc
Formula=Round(CPU_BASE_FREQUENCY * (CPU_PERF_PERCENT ? CPU_PERF_PERCENT : 100) / 100)
UpdateDivider=1
DynamicVariables=1

; ==========================
; TOP Procesos (UsageMonitor CPU/RAM/IO)
; Módulo: top.bundle.js
; Campos consumidos: top-cpu.i.name/value, top-mem.i.name/value, top-io.i.name/value
; Notas:
; - Index=1..5 retorna nombre (string) y valor (num) del proceso en esa posición.
; - Alias=CPU → % Processor Time; Alias=RAM → Working Set - Private; Alias=IO → IO Data Bytes/sec.
; - Blacklist incluye procesos de “ruido” comunes; `_Total` e `Idle` ya están excluidos por defecto.
; - Rollup=1 agrupa instancias `nombre#N` bajo un solo proceso.
; ==========================

[TopCPU1]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=1
Blacklist=_Total|Idle|Rainmeter|dwm|csrss|svchost|lsass|System|spoolsv
Rollup=1
UpdateDivider=1

[TopCPU2]
Measure=Plugin
Plugin=UsageMonitor
Alias=CPU
Index=2
Blacklist=_Total|Idle|Rainmeter|dwm|csrss|svchost|lsass|System|spoolsv
