; ==========================
; DISK (UsageMonitor + FreeDiskSpace)
; Módulo: disk-bundle.js
; Campos consumidos: diskX.usagePct, diskX.freePct, diskX.latency, diskX.read, diskX.write
; Donde X es el índice (0 → C:\, 1 → D:\). Ajusta las letras si tu sistema difiere.
; ==========================

; ==========================
; NUEVO CONTRATO: DISK_* (0-based)
; Contrato 0-based DISK_*; sin alias HDD.
; ==========================

[DISK_0_FREE_PCT]
Measure=Plugin
Plugin=UsageMonitor
Category=LogicalDisk
Counter="% Free Space"
Name="C:"
UpdateDivider=2

[DISK_0_FREE_MB]
Measure=Calc
Formula=Round([DISK_0_FREE_BYTES] / 1048576)
DynamicVariables=1
UpdateDivider=2

[DISK_0_TOTAL_BYTES]
Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=3600

[DISK_0_FREE_BYTES]
