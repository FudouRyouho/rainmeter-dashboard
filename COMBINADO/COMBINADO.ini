;[CPU_TOTAL]
; Tipo: UsageMonitor (PerfMon) → % | Naturaleza: dinámico
; Origen: Processor Information / % Processor Utility / _Total
; Valor esperado: 0–100 (uso agregado del CPU)
; Uso: cpu.bundle.js → cpu-usage y fallback de grilla LP
[CPU_TOTAL]
Measure=Plugin
Plugin=UsageMonitor
Category=Processor Information
Counter=% Processor Utility
Name="_Total"
UpdateDivider=1

;[PROCESS_COUNT]
; Tipo: UsageMonitor (PerfMon) → entero | Naturaleza: dinámico
; Origen: System / Processes
; Valor esperado: 100–2000 según sistema y carga
; Uso: cpu.bundle.js → cpu.process
[PROCESS_COUNT]
Measure=Plugin
Plugin=UsageMonitor
Category=System
Counter=Processes
UpdateDivider=1

;[ THREAD_COUNT]
; Tipo: UsageMonitor (PerfMon) → entero | Naturaleza: dinámico
; Origen: System / Threads
; Valor esperado: 1000–20000 según sistema y carga
; Uso: cpu.bundle.js → cpu.subprocess
[THREAD_COUNT]
Measure=Plugin
Plugin=UsageMonitor
Category=System
Counter=Threads
UpdateDivider=1


; --- Fin Medidas Base ---

[CT_MAX_TEMP]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=MaxTemperature
UpdateDivider=1
Disabled=1

[CT_CPU_SPEED]
Measure=Plugin
Plugin=CoreTemp
CoreTempType=CpuSpeed
UpdateDivider=1
Disabled=1

; Temperatura CPU (HWiNFO VSB – Registry)
; Tipo: Registry → °C | Naturaleza: dinámico
; Origen: #HWi_Reg_Hive#/#HWi_Reg_Base# con índice #HWiNFO_CPU_TEMP#
; Valor esperado: 30–95 °C
[CPU_TEMP_C_REG]
Measure=Registry
RegHKey=#HWi_Reg_Hive#
RegKey=#HWi_Reg_Base#
RegValue=ValueRaw#HWiNFO_CPU_TEMP#
UpdateDivider=1
DynamicVariables=1
;[ CPU_TEMP_C]
; Tipo: Calc → °C | Naturaleza: dinámico
; Uso: copia directa de [CPU_TEMP_C_REG] para consumo en JS
[CPU_TEMP_C]
Measure=Calc
Formula=[CPU_TEMP_C_REG]
UpdateDivider=1
DynamicVariables=1

; Uptime del sistema para panel derecho
; Tipo: Uptime → string HH:MM:SS | Naturaleza: dinámico
; Uso: cpu.bundle.js → sys.right.uptime
[SYS_UPTIME]
Measure=Uptime
Format="%3!02i!:%2!02i!:%1!02i!"
AddDaysToHours=1
UpdateDivider=1

