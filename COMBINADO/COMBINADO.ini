; ==========================
; RAM (UsageMonitor/PhysicalMemory) medidas para WebView API
; Basado en docs/integracion-rainmeter-webview2.md
; ==========================
;[ PHYS_TOTAL]
; Tipo: PhysicalMemory → bytes | Naturaleza: estático
; Origen: medida interna de Rainmeter (Total=1)
; Valor esperado: tamaño total de RAM física (p.ej. 16–64 GiB)
; Uso: referencia para normalizaciones en la UI (se convierte a GB)
[PHYS_TOTAL]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

;[ AVAILABLE_MB]
; Tipo: UsageMonitor (PerfMon) → MB | Naturaleza: dinámico
; Origen: Memory / Available MBytes
; Valor esperado: 500–32000 MB según carga
; Uso: cálculo de RAM libre; consumo directo en bundle
[AVAILABLE_MB]
Measure=Plugin
Plugin=UsageMonitor
Category=Memory
Counter=Available MBytes
UpdateDivider=2

;[ COMMITTED_BYTES]
; Tipo: UsageMonitor (PerfMon) → bytes | Naturaleza: dinámico
; Origen: Memory / Committed Bytes
; Valor esperado: variable, escala en bytes (se normaliza a GB en UI)
; Uso: memoria comprometida (private + pagefile), útil para gráficas
[COMMITTED_BYTES]
Measure=Plugin
Plugin=UsageMonitor
Category=Memory
Counter=Committed Bytes
UpdateDivider=2

;[ COMMIT_LIMIT]
; Tipo: UsageMonitor (PerfMon) → bytes | Naturaleza: semi-estático
; Origen: Memory / Commit Limit
; Valor esperado: total de RAM física + pagefile (bytes)
; Uso: límite de compromiso, divisor para % de compromiso
[COMMIT_LIMIT]
Measure=SwapMemory
Total=1
UpdateDivider=-1

;[ CACHE_BYTES]
; Tipo: UsageMonitor (PerfMon) → bytes | Naturaleza: dinámico
; Origen: Memory / Cache Bytes
; Valor esperado: 100 MB – varios GB según actividad
; Uso: tamaño del caché del sistema; indicador de presión de memoria
[CACHE_BYTES]
Measure=Plugin
Plugin=UsageMonitor
Category=Memory
Counter=Cache Bytes
UpdateDivider=2

