[GPU_VRAM_TOT_TOTAL_MB_FALLBACK]
Measure=Calc
Formula=(GPU_VRAM_TOT_TOTAL_MB>0 ? GPU_VRAM_TOT_TOTAL_MB : (GPU_VRAM_USAGE_PCT_REG>0 ? Round(GPU_VRAM_TOT_USED_MB_REG*100/GPU_VRAM_USAGE_PCT_REG) : 0))
