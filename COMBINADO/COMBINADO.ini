; ==========================
; NET (NetIn/NetOut + Ping + SysInfo + WebParser)
; Módulo: net-bundle.js
; Campos consumidos: net-up, net-down, net-ping, net-ipPublic,
;                    net-totalUp, net-totalDown
; Notas:
; - Interface=Best selecciona la NIC con mejor conectividad.
; - UseBits=1 en Up/Down para obtener bps (se formatea a Kbps/Mbps en JS).
; - Totales usan Cumulative=1 y retornan bytes acumulados desde el inicio.
; - IPs locales via SysInfo (IP_ADDRESS, índices 0..3) para elegir la más válida.
; - IP pública via WebParser contra api.ipify.org.
; ==========================

;[ NetUp]
; Tipo: NetOut → bits/segundo | Naturaleza: dinámico
; Origen: adaptador con mejor conectividad (Interface=Best)
; Uso: velocidad de subida (formateo Kbps/Mbps en JS)
[NetUp]
Measure=NetOut
Interface=Best
UseBits=1
AverageSize=2
UpdateDivider=1

;[ NetDown]
; Tipo: NetIn → bits/segundo | Naturaleza: dinámico
; Origen: adaptador con mejor conectividad (Interface=Best)
; Uso: velocidad de bajada (formateo Kbps/Mbps en JS)
[NetDown]
Measure=NetIn
Interface=Best
UseBits=1
AverageSize=2
UpdateDivider=1

;[ NetUpTotal]
; Tipo: NetOut → bytes acumulados | Naturaleza: persistente (Rainmeter.stats)
; Uso: total de subida (se muestra en MB/GB en JS)
[NetUpTotal]
Measure=NetOut
Interface=Best
Cumulative=1
UpdateDivider=1

;[ NetDownTotal]
; Tipo: NetIn → bytes acumulados | Naturaleza: persistente (Rainmeter.stats)
; Uso: total de bajada (se muestra en MB/GB en JS)
[NetDownTotal]
Measure=NetIn
Interface=Best
Cumulative=1
UpdateDivider=1

;[ PingExt]
; Tipo: Plugin Ping → ms | Naturaleza: dinámico
; Origen: 8.8.8.8 (Google DNS)
; Uso: latencia externa
[PingExt]
Measure=Plugin
Plugin=PingPlugin
DestAddress=8.8.8.8
UpdateRate=2000

;[ PublicIP]
; Tipo: WebParser → string | Naturaleza: dinámico (cada 10 min)
; Origen: https://api.ipify.org
; Uso: IP pública visible
[PublicIP]
Measure=Plugin
Plugin=WebParser
URL=https://api.ipify.org
UpdateRate=600
RegExp=(?siU)^(.*)$
StringIndex=1
DynamicVariables=1

;[ IP0]
; Tipo: SysInfo → IPv4 | Naturaleza: dinámico
; Origen: IP_ADDRESS índice 0
[IP0]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=0
DynamicVariables=1

;[ IP1]
; Tipo: SysInfo → IPv4 | Naturaleza: dinámico
; Origen: IP_ADDRESS índice 1
[IP1]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=1
DynamicVariables=1

;[ IP2]
; Tipo: SysInfo → IPv4 | Naturaleza: dinámico
; Origen: IP_ADDRESS índice 2
[IP2]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=2
DynamicVariables=1

;[ IP3]
; Tipo: SysInfo → IPv4 | Naturaleza: dinámico
; Origen: IP_ADDRESS índice 3
[IP3]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=3
DynamicVariables=1

[Web]
Measure=Plugin
Plugin=WebView
URL=file:///#CURRENTPATH#index.html
HostObject=Native.api,RainmeterAPI
X=2
Y=0
